name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
        env:
          VERSION_BASE_REVISION: ${{ github.event.before || github.event.pull_request.base.sha }}
      - run: npm run check
      - name: Repeat subprocess lifecycle regressions
        if: matrix.os == 'macos-15-intel' || matrix.os == 'windows-latest'
        run: >-
          node --input-type=module -e "import { execFileSync } from 'node:child_process';
          for (let i = 1; i <= 5; i++) {
          console.log('Subprocess lifecycle repetition ' + i + '/5');
          execFileSync(process.execPath, ['--import', 'tsx', '--test', '--test-concurrency=1', '--test-name-pattern', 'wire-only stdio connector|OS releases singleton|six bootstrap contenders', 'tests/http.test.ts', 'tests/managed.test.ts'], { stdio: 'inherit', timeout: 600000 }); }"
      - run: npm audit --audit-level=high
      - run: npm run acceptance:install
      - run: npm pack --dry-run
